<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>9. CSS Animation</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Exercise 9: CSS Animation Demo</h1>
        <div style="width:150px;height:150px;background:#e74c3c;margin:30px auto;border-radius:50%;animation: pulse 2s infinite;"></div>
        <style>@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}</style>
        <p><a href="workinwebprogramming.html">← Back to Web Exercises</a></p>
    </div>
</body>
</html>
